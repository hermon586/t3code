name: Fork Sync

on:
  push:
    branches: [main]
    paths: [.github/workflows/fork-sync.yml]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into the fork
    if: github.repository == 'hermon586/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          ssh-key: ${{ secrets.FORK_SYNC_SSH_KEY }}

      - name: Configure upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

      - id: merge
        name: Merge onto upstream main
        shell: bash
        run: |
          set -euo pipefail
          old_sha="$(git rev-parse HEAD)"
          echo "old_sha=$old_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-edit upstream/main
          merge_status=$?
          set -e

          if (( merge_status != 0 )); then
            conflict_files="$(git diff --name-only --diff-filter=U)"
            {
              echo "conflict=true"
              echo "changed=false"
              echo "conflict_files<<EOF"
              echo "$conflict_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            exit 0
          fi

          new_sha="$(git rev-parse HEAD)"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          if [[ "$new_sha" == "$old_sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          issue_number="$(
            gh issue list \
              --state open \
              --search '"Automatic upstream sync conflict" in:title' \
              --json number \
              --jq '.[0].number // empty'
          )"
          body_file="$RUNNER_TEMP/upstream-sync-conflict.md"
          {
            echo "The scheduled merge onto \`pingdotgg/t3code:main\` needs manual conflict resolution."
            echo
            echo "Conflicting files:"
            echo '```text'
            echo "$CONFLICT_FILES"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$body_file"

          if [[ -n "$issue_number" ]]; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" \
              --raw-field "body=$(<"$body_file")"
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues" \
              --raw-field "title=Automatic upstream sync conflict" \
              --raw-field "body=$(<"$body_file")"
          fi

      - name: Fail when manual conflict resolution is required
        if: always() && steps.merge.outputs.conflict == 'true'
        run: exit 1

      - name: Push merged main
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Close resolved conflict issue
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(
            gh issue list \
              --state open \
              --search '"Automatic upstream sync conflict" in:title' \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --comment "The automatic upstream merge is working again."
          fi
